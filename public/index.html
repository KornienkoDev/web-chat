<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Local Web Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar: fixed column on desktop, off-canvas drawer on mobile -->
    <aside id="sidebar" class="sidebar" aria-label="Chats">
      <div class="sidebar-head">
        <span class="brand">Local Chat</span>
        <button id="btnNewChat" class="btn btn-primary btn-sm" title="New chat">+ New</button>
      </div>
      <input id="chatSearch" class="chat-search" type="search" placeholder="Search chats" autocomplete="off">
      <nav id="chatList" class="chat-list" aria-label="Chat history"></nav>
      <div class="sidebar-foot">
        <button id="btnMemory" class="btn btn-ghost btn-block">Memory <span id="memCount"></span></button>
        <button id="btnSettings" class="btn btn-ghost btn-block">Settings</button>
        <div class="io-row">
          <button id="btnExport" class="btn btn-ghost btn-sm">Export</button>
          <button id="btnImport" class="btn btn-ghost btn-sm">Import</button>
          <input id="importFile" type="file" accept="application/json,.json" hidden>
        </div>
      </div>
    </aside>
    <div id="backdrop" class="backdrop" hidden></div>

    <main class="main">
      <header class="topbar">
        <button id="btnMenu" class="icon-btn" aria-label="Open chats">&#9776;</button>
        <div class="topbar-title">
          <strong id="chatTitle">New chat</strong>
          <small id="modelLabel"></small>
        </div>
      </header>

      <div id="warning" class="banner" hidden></div>
      <div id="messages" class="messages" role="log" aria-live="polite"></div>

      <footer class="composer">
        <textarea id="input" rows="1" placeholder="Message…" autocomplete="off"></textarea>
        <button id="btnSend" class="icon-btn send-btn" aria-label="Send">&#10148;</button>
        <button id="btnStop" class="icon-btn send-btn stop-btn" aria-label="Stop" hidden>&#9632;</button>
      </footer>
    </main>
  </div>

  <!-- Settings dialog -->
  <dialog id="settingsDialog" class="dialog">
    <form method="dialog" id="settingsForm" class="dialog-body">
      <h2>Settings</h2>
      <label class="field"><span>API base URL (OpenAI-compatible)</span>
        <input id="setBaseUrl" type="url" placeholder="http://127.0.0.1:8081/v1"></label>
      <label class="field"><span>API key (optional)</span>
        <input id="setApiKey" type="password" autocomplete="off"></label>
      <label class="field"><span>Model</span>
        <input id="setModel" list="modelList" placeholder="leave empty to use the first served model" autocomplete="off">
        <datalist id="modelList"></datalist></label>
      <div class="field-row">
        <label class="field"><span>Temperature</span>
          <input id="setTemp" type="number" step="0.1" min="0" max="2" placeholder="server default"></label>
        <label class="field"><span>Max tokens</span>
          <input id="setMaxTokens" type="number" min="1" placeholder="1024"></label>
      </div>
      <div class="field-row">
        <label class="field"><span>Last messages to send</span>
          <input id="setContext" type="number" min="2" max="200" placeholder="20"></label>
        <label class="field"><span>Extended thinking</span>
          <select id="setThinking">
            <option value="default">Server default</option>
            <option value="on">On</option>
            <option value="off">Off</option>
          </select></label>
      </div>
      <label class="field"><span>System prompt</span>
        <textarea id="setSystem" rows="3" placeholder="Optional"></textarea></label>
      <p id="settingsMsg" class="muted"></p>
      <div class="dialog-actions">
        <button type="button" id="btnTestConn" class="btn btn-ghost">Test connection</button>
        <button value="cancel" class="btn btn-ghost">Cancel</button>
        <button value="save" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Memory dialog -->
  <dialog id="memoryDialog" class="dialog">
    <div class="dialog-body">
      <h2>Long-term memory <small class="muted" id="memCountTitle"></small></h2>
      <div class="mem-add">
        <textarea id="memInput" rows="2" placeholder="Add a fact to remember…"></textarea>
        <button id="btnMemAdd" class="btn btn-primary">Add</button>
      </div>
      <label class="mem-toggle"><input type="checkbox" id="memAuto">
        <span>Fallback: also learn facts from every reply (for models without tool support)</span></label>
      <button id="btnMemExtract" class="btn btn-ghost btn-block">Extract from current chat</button>
      <p id="memStatus" class="muted" hidden></p>
      <div id="memList" class="mem-list" aria-live="polite"></div>
      <div class="dialog-actions">
        <button id="btnMemClear" class="btn btn-ghost btn-danger-ghost">Clear all</button>
        <button id="btnMemClose" class="btn">Close</button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
